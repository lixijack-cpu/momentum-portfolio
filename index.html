<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Systematic Equity — Long-Only Multi-Factor Strategy</title>
<meta name="description" content="Walk-forward out-of-sample results for a long-only, multi-factor systematic equity strategy, net of costs, benchmarked against SPY." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<style>
:root{
  --bg:#fafaf8; --bg-secondary:#f1f5f9; --surface:#ffffff; --surface-hover:#f8fafc;
  --border:#e2e8f0;
  --shadow:0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.04);
  --shadow-hover:0 8px 32px rgba(0,0,0,.12);
  --text-primary:#0f172a; --text-secondary:#475569; --text-muted:#94a3b8;
  --accent:#1d4ed8; --accent-soft:rgba(29,78,216,.08);
  --purple:#6d28d9;
  --positive:#059669; --positive-soft:rgba(5,150,105,.08);
  --negative:#dc2626; --negative-soft:rgba(220,38,38,.08);
  --amber:#b45309; --amber-soft:rgba(180,83,9,.10);
  --neutral-soft:rgba(148,163,184,.10);
  --chart-strategy:#1d4ed8; --chart-spy:rgba(148,163,184,.4); --chart-spy-fill:rgba(148,163,184,.08);
  --chart-backtest:#94a3b8; --chart-sim:#f59e0b;
  --crash-fill:rgba(220,38,38,.05);
  --heatmap-pos5:#14532d; --heatmap-pos4:#15803d; --heatmap-pos3:#16a34a; --heatmap-pos2:#4ade80; --heatmap-pos1:#bbf7d0;
  --heatmap-neg1:#fee2e2; --heatmap-neg2:#fca5a5; --heatmap-neg3:#ef4444; --heatmap-neg4:#dc2626; --heatmap-neg5:#7f1d1d;
  --sector-1:#1d4ed8; --sector-2:#6d28d9; --sector-3:#059669; --sector-4:#f59e0b;
  --sector-5:#ef4444; --sector-6:#0891b2; --sector-7:#65a30d; --sector-8:#475569;
  --sector-cash:rgba(148,163,184,.22);
  --hold-finance:#1d4ed8; --hold-manufacturing:#6d28d9; --hold-healthcare:#059669;
  --hold-durables:#b45309; --hold-other:#475569;
}
html[data-theme="dark"]{
  --bg:#111111; --bg-secondary:#161616; --surface:#1c1c1c; --surface-hover:#222222;
  --border:#2a2a2a;
  --shadow:0 1px 3px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  --shadow-hover:0 8px 32px rgba(0,212,255,.08);
  --text-primary:#f4f4f5; --text-secondary:#a1a1aa; --text-muted:#52525b;
  --accent:#00d4ff; --accent-soft:rgba(0,212,255,.08);
  --purple:#bf7fff;
  --positive:#84cc16; --positive-soft:rgba(132,204,22,.08);
  --negative:#f87171; --negative-soft:rgba(248,113,113,.08);
  --amber:#f59e0b; --amber-soft:rgba(245,158,11,.12);
  --neutral-soft:rgba(161,161,170,.10);
  --chart-strategy:#00d4ff; --chart-spy:rgba(161,161,170,.3); --chart-spy-fill:rgba(161,161,170,.06);
  /* Lifted off the spec's #475569: on a #111 ground that reads as absent, and this line
     is the strategy's own 20-year record — it has to stay legible against the SPY grey. */
  --chart-backtest:#8a8a93; --chart-sim:#f59e0b;
  --crash-fill:rgba(248,113,113,.07);
  --heatmap-pos5:#065f46; --heatmap-pos4:#059669; --heatmap-pos3:#34d399; --heatmap-pos2:#6ee7b7; --heatmap-pos1:#d1fae5;
  --heatmap-neg1:#fef2f2; --heatmap-neg2:#fca5a5; --heatmap-neg3:#f87171; --heatmap-neg4:#ef4444; --heatmap-neg5:#7f1d1d;
  --sector-1:#00d4ff; --sector-2:#bf7fff; --sector-3:#34d399; --sector-4:#fbbf24;
  --sector-5:#f87171; --sector-6:#22d3ee; --sector-7:#a3e635; --sector-8:#71717a;
  --sector-cash:rgba(161,161,170,.16);
  --hold-finance:#00d4ff; --hold-manufacturing:#bf7fff; --hold-healthcare:#34d399;
  --hold-durables:#f59e0b; --hold-other:#71717a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--text-primary);
  -webkit-font-smoothing:antialiased; line-height:1.5;
  transition:background .3s ease, color .2s ease;
}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px 64px}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:100; min-height:56px;
  background:var(--surface); border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  transition:background .3s ease, border-color .3s ease;
}
.hdr{max-width:1200px;margin:0 auto;padding:8px 24px;min-height:56px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand b{font-weight:700;font-size:1.1rem;letter-spacing:-.01em;color:var(--text-primary)}
/* --accent and --purple already resolve to #1d4ed8→#6d28d9 in light and #00d4ff→#bf7fff
   in dark, so one rule covers both themes and cannot drift from the palette. Guarded by
   @supports because the transparent fill would erase the wordmark if the clip is ignored. */
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .brand b{
    background:linear-gradient(135deg,var(--accent),var(--purple));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
}
.brand span{color:var(--text-muted);font-size:.78rem}
.nav-right{display:flex;align-items:center;gap:12px}
.nav-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--accent-soft); border:1px solid var(--accent); border-radius:999px;
  padding:6px 14px; font-size:.85rem; font-weight:500; color:var(--text-primary);
  white-space:nowrap;
}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--positive);
  animation:pulse 2s ease-in-out infinite;flex:none}
.pulse.neg{background:var(--negative)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.65}}
#themeToggle{
  width:40px;height:40px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);cursor:pointer;font-size:1.1rem;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:transform .4s ease, background .2s ease, border-color .2s ease;
  color:inherit;
}
#themeToggle:hover{background:var(--surface-hover)}
#themeToggle.spin{transform:rotate(180deg)}

/* ---------- cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  box-shadow:var(--shadow); padding:24px; margin-top:20px;
  transition:background .3s ease, border-color .3s ease, transform .2s ease, box-shadow .2s ease;
}
.card-title{font-weight:600;font-size:1.05rem;letter-spacing:-.01em}
.card-sub{color:var(--text-secondary);font-size:.82rem;margin-top:3px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.title-stat{font-size:.82rem;color:var(--text-secondary);text-align:right}
.title-stat b{color:var(--text-primary);font-weight:600}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:24px}
.stat{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:20px 24px; box-shadow:var(--shadow);
  transition:transform .2s ease, box-shadow .2s ease, background .3s ease, border-color .3s ease;
}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.stat.a{border-left:3px solid var(--accent)}
.stat.p{border-left:3px solid var(--purple)}
.stat.m{border-left:3px solid var(--amber)}
.stat.l{border-left:3px solid var(--positive)}
.stat.l.neg{border-left-color:var(--negative)}
.stat-label{text-transform:uppercase;font-size:.68rem;letter-spacing:.1em;color:var(--text-muted);font-weight:500}
.stat-num{font-size:2.6rem;font-weight:900;letter-spacing:-.02em;line-height:1.15;margin:6px 0 2px;
  font-variant-numeric:tabular-nums}
.stat-sub{font-size:.8rem;color:var(--text-secondary)}

/* ---------- chart ---------- */
.chart-box{position:relative;height:440px}
.chart-box.short{height:320px}
.chart-hint{text-align:center;font-size:.75rem;color:var(--text-muted);margin-top:12px}
#tooltip{
  position:absolute;pointer-events:none;opacity:0;transition:opacity .12s ease;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;
  box-shadow:var(--shadow-hover);font-size:.8rem;z-index:20;min-width:170px;
}
#tooltip .tt-date{font-weight:600;margin-bottom:6px;color:var(--text-primary)}
#tooltip .tt-row{display:flex;justify-content:space-between;gap:16px;font-variant-numeric:tabular-nums}
#tooltip .tt-row span:first-child{color:var(--text-secondary)}

/* ---------- crash table ---------- */
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:620px}
thead th{
  text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-muted);font-weight:500;padding:0 12px 10px 0;border-bottom:1px solid var(--border);
}
tbody td{padding:12px 12px 12px 0;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{transition:background .15s ease}
tbody tr.data-row:hover{background:var(--surface-hover)}
.period{font-weight:600;color:var(--text-primary)}
.pill{display:inline-block;border-radius:6px;padding:3px 10px;font-weight:600;font-size:.82rem;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.neg{background:var(--negative-soft);color:var(--negative)}
.pill.spy{background:var(--neutral-soft);color:var(--text-secondary)}
.pill.win{background:var(--positive-soft);color:var(--positive)}
.pill.lose{background:var(--amber-soft);color:var(--amber)}
.bars{min-width:180px}
.bar{height:6px;border-radius:3px}
.bar-strategy{background:var(--negative);margin-bottom:2px}
.bar-spy{background:var(--text-muted)}
.bar-legend{font-size:.66rem;color:var(--text-muted);margin-top:4px}
.note-row td{padding:0 0 12px;border-bottom:1px solid var(--border);
  color:var(--amber);font-size:.75rem;font-style:italic}

/* ---------- holdings ---------- */
.holdings{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.hold{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;
  border-left:3px solid var(--hold-other);
  opacity:0;animation:fadeIn .4s ease forwards;
  transition:background .3s ease,border-color .3s ease,transform .2s ease,box-shadow .2s ease;
}
.hold:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
@keyframes fadeIn{to{opacity:1}}
.hold-top{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.hold-tkr{font-weight:700;font-size:1rem;letter-spacing:-.01em}
.hold-name{font-size:.85rem;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chip{font-size:.65rem;padding:2px 8px;border-radius:999px;background:var(--bg-secondary);
  color:var(--text-secondary);white-space:nowrap;flex:none}
.hold-mid{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;
  font-variant-numeric:tabular-nums}
.hold-val{font-weight:600;font-size:.95rem}
.hold-shares{font-size:.78rem;color:var(--text-muted)}
.wbar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;flex:1}
.wbar>div{height:4px;border-radius:2px}
.hold-bot{display:flex;align-items:center;gap:10px}
.wpct{font-size:.75rem;color:var(--text-muted);font-variant-numeric:tabular-nums;flex:none}
.summary{text-align:right;color:var(--text-secondary);font-size:.82rem;margin-top:14px;
  font-variant-numeric:tabular-nums}
.disclaimer{font-size:.75rem;color:var(--text-muted);font-style:italic;margin-top:8px}

/* ---------- heatmap ---------- */
.hm{display:grid;gap:2px;min-width:760px;font-variant-numeric:tabular-nums}
.hm-h{font-size:.65rem;color:var(--text-muted);text-align:center;font-weight:500;padding-bottom:2px}
.hm-y{font-size:.72rem;color:var(--text-muted);text-align:right;padding-right:8px;
  display:flex;align-items:center;justify-content:flex-end}
.hm-cell{display:flex;flex-direction:column;gap:1px}
.hm-cell i{display:block;height:14px;border-radius:2px}
.hm-empty{height:29px;background:var(--bg-secondary);border-radius:2px}
.hm-pill{font-size:.7rem;font-weight:600;border-radius:4px;padding:2px 6px;text-align:center;
  display:flex;align-items:center;justify-content:center;margin-left:6px;white-space:nowrap}
.hm-legend{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:16px;
  font-size:.72rem;color:var(--text-muted)}
.grad{width:180px;height:10px;border-radius:5px}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- about / footer ---------- */
.acc-btn{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:none;border:0;cursor:pointer;color:var(--text-primary);
  font-family:inherit;font-size:1.05rem;font-weight:600;padding:0;text-align:left;
}
.acc-btn svg{transition:transform .3s ease;flex:none;stroke:var(--text-muted)}
.acc-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.acc-body{display:none;padding-top:16px;color:var(--text-secondary);font-size:.88rem}
.acc-body.open{display:block}
.acc-body h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);
  margin:16px 0 6px;font-weight:600}
.acc-body p{margin-bottom:8px}
.acc-body ul{margin:0 0 8px 18px}
footer{
  border-top:1px solid var(--border);margin-top:40px;padding:24px;
  display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;
  max-width:1200px;margin-left:auto;margin-right:auto;
  font-size:.76rem;color:var(--text-muted);
}
footer a{color:var(--text-secondary);text-decoration:none}
footer a:hover{color:var(--accent)}
.f-center{text-align:center}
.f-right{display:flex;gap:14px;justify-content:flex-end;align-items:center}
.f-right svg{fill:var(--text-muted);transition:fill .2s ease}
.f-right a:hover svg{fill:var(--accent)}
.loading{text-align:center;padding:64px 0;color:var(--text-muted)}

@media (max-width:768px){
  .wrap{padding:0 16px 48px}
  .hdr{padding:8px 16px}
  .brand{width:100%}
  .nav-right{width:100%;flex-wrap:wrap}
  .hero{grid-template-columns:repeat(2,1fr);gap:12px}
  .stat{padding:16px}
  .stat-num{font-size:1.9rem}
  .chart-box,.chart-box.short{height:280px}
  .holdings{grid-template-columns:1fr}
  .card{padding:18px}
  footer{grid-template-columns:1fr;text-align:center}
  .f-right{justify-content:center}
}
</style>
</head>
<body>

<script>
/* ============================ theme ============================ */
(function initTheme(){
  var saved = null;
  try { saved = localStorage.getItem('theme'); } catch(e){}
  var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();

function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function currentTheme(){
  return document.documentElement.getAttribute('data-theme') || 'light';
}
function syncToggleIcon(){
  document.getElementById('themeToggle').textContent = currentTheme() === 'dark' ? '☀️' : '🌙';
}

/* ============================ format helpers ============================ */
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MINUS = '−';

function pct(x, dp){
  dp = dp === undefined ? 2 : dp;
  var v = x * 100;
  return (v >= 0 ? '+' : MINUS) + Math.abs(v).toFixed(dp) + '%';
}
/* Multi-hundred-percent figures need thousands separators to stay readable. */
function pctBig(x){
  var v = x * 100;
  return (v >= 0 ? '+' : MINUS) + Math.round(Math.abs(v)).toLocaleString('en-US') + '%';
}
function pctPlain(x, dp){
  var v = x * 100;
  return (v >= 0 ? '' : MINUS) + Math.abs(v).toFixed(dp === undefined ? 2 : dp) + '%';
}
function money(x, dp){
  return '$' + Number(x).toLocaleString('en-US', {
    minimumFractionDigits: dp === undefined ? 0 : dp,
    maximumFractionDigits: dp === undefined ? 0 : dp
  });
}
function monthLabel(ym){
  var p = ym.split('-');
  return MONTHS[parseInt(p[1], 10) - 1] + ' ' + p[0];
}
function longMonth(ym){
  var names = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var p = ym.split('-');
  return names[parseInt(p[1], 10) - 1] + ' ' + p[0];
}
function prettyDate(iso){
  var p = iso.split('-');
  return MONTHS[parseInt(p[1], 10) - 1] + ' ' + parseInt(p[2], 10) + ', ' + p[0];
}

/* ============================ state ============================ */
var DATA = null;
var charts = {};

fetch('./portfolio_snapshot.json', {cache: 'no-store'})
  .then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(function(json){
    DATA = json;
    render();
    syncToggleIcon();
  })
  .catch(function(err){
    document.getElementById('app').innerHTML =
      '<div class="loading">Could not load portfolio data (' + err.message + ').</div>';
  });

document.getElementById('themeToggle').addEventListener('click', function(){
  var next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e){}
  syncToggleIcon();
  this.classList.toggle('spin');
  // Canvas colours are baked at draw time, so charts must be rebuilt on a theme flip.
  setTimeout(rebuildCharts, 60);
});

function stat(cls, label, value, colour, sub, kind){
  return '<div class="stat ' + cls + '">' +
    '<div class="stat-label">' + label + '</div>' +
    '<div class="stat-num" style="color:var(--' + colour + ')" ' +
      'data-value="' + value + '" data-kind="' + kind + '">&nbsp;</div>' +
    '<div class="stat-sub">' + sub + '</div>' +
  '</div>';
}

function formatStat(kind, v){
  if(kind === 'pct')      return pct(v, 2);
  if(kind === 'pctplain') return pctPlain(v, 2);
  if(kind === 'num')      return v.toFixed(3);
  if(kind === 'live')     return (v >= 0 ? '▲ +' : '▼ ' + MINUS) + Math.abs(v * 100).toFixed(1) + '%';
  return String(v);
}

function animateHero(){
  var nodes = document.querySelectorAll('.stat-num');
  var DUR = 1200;
  Array.prototype.forEach.call(nodes, function(node){
    var target = parseFloat(node.getAttribute('data-value'));
    var kind = node.getAttribute('data-kind');
    if(!isFinite(target)){ node.textContent = '—'; return; }

    var settled = false;
    function settle(){
      settled = true;
      node.textContent = formatStat(kind, target);
    }
    // Browsers throttle rAF in background tabs, which would otherwise strand these
    // numbers part-way through the count-up — a page loaded in a background tab would
    // sit there showing a wrong performance figure. The timer guarantees the true value
    // lands whether or not the animation ever gets to run.
    setTimeout(settle, DUR + 250);

    var start = null;
    function step(ts){
      if(settled) return;
      if(start === null) start = ts;
      var t = Math.min((ts - start) / DUR, 1);
      var eased = 1 - Math.pow(1 - t, 3);
      node.textContent = formatStat(kind, target * eased);
      if(t < 1) requestAnimationFrame(step);
      else settle();
    }
    requestAnimationFrame(step);
  });
}

function toXY(arr){
  return arr.map(function(p){ return {x: p.d, y: p.v}; });

/* Shade each crash window straight from crash_table, so the chart and the table below
   can never describe different periods. */
var crashShade = {
  id: 'crashShade',
  beforeDatasetsDraw: function(chart){
    var t = chart.scales.x, area = chart.chartArea;
    if(!t || !area || !DATA.crash_table) return;
    var ctx = chart.ctx;
    ctx.save();
    ctx.fillStyle = cssVar('--crash-fill');
    DATA.crash_table.forEach(function(row){
      var x0 = t.getPixelForValue(new Date(row.start).getTime());
      var x1 = t.getPixelForValue(new Date(row.end).getTime());
      var a = Math.max(Math.min(x0, x1), area.left);
      var b = Math.min(Math.max(x0, x1), area.right);
      if(b > a) ctx.fillRect(a, area.top, b - a, area.bottom - area.top);
    });
    ctx.restore();
  }
};

/* Glow only the live line, and only in dark mode — a canvas-wide CSS filter would
   bleed onto the benchmark and the gridlines. */
var liveGlow = {
  id: 'liveGlow',
  beforeDatasetDraw: function(chart, args){
    if(currentTheme() !== 'dark') return;
    if(chart.data.datasets[args.index].label !== 'Live Paper Trading') return;
    chart.ctx.save();
    chart.ctx.shadowColor = cssVar('--chart-strategy');
    chart.ctx.shadowBlur = 8;
  },
  afterDatasetDraw: function(chart, args){
    if(currentTheme() !== 'dark') return;
    if(chart.data.datasets[args.index].label !== 'Live Paper Trading') return;
    chart.ctx.restore();
  }
};

/* The trough marker is located from the data, not pinned to a hardcoded date, so it
   stays on the real bottom if the series is ever rebuilt. */
function troughOf(startISO, endISO){
  var s = new Date(startISO).getTime(), e = new Date(endISO).getTime();
  var best = null;
  DATA.equity_curve.backtest.forEach(function(p){
    var t = new Date(p.d).getTime();
    if(t < s || t > e) return;
    if(best === null || p.v < best.v) best = p;
  });
  return best;
}

var crashLabels = {
  id: 'crashLabels',
  afterDatasetsDraw: function(chart){
    var t = chart.scales.x, area = chart.chartArea;
    if(!t || !area) return;
    var ctx = chart.ctx;
    ctx.save();
    ctx.font = '600 10px Inter, sans-serif';
    ctx.textAlign = 'center';

    // Below roughly a phone's width these labels overlap into an unreadable smear, so
    // the crash callouts drop out and only the live marker is kept. The shaded bands
    // still mark the same periods, and the table below names them.
    var roomy = (area.right - area.left) > 520;

    var marks = roomy ? DATA.crash_table.map(function(row){
      return {d: row.start, text: '▼ ' + shortCrash(row.period), colour: cssVar('--negative'), y: area.top + 14};
    }) : [];

    var gfc = DATA.crash_table.filter(function(r){ return /GFC|Financial/i.test(r.period); })[0];
    if(roomy && gfc){
      var low = troughOf(gfc.start, gfc.end);
      if(low) marks.push({d: low.d, text: '▲ Bottom', colour: cssVar('--positive'), y: area.bottom - 8});
    }
    if(DATA.live && DATA.live.inception_date){
      marks.push({d: DATA.live.inception_date, text: '📍 Live', colour: cssVar('--accent'), y: area.top + 14});
    }

    marks.forEach(function(m){
      var x = t.getPixelForValue(new Date(m.d).getTime());
      if(x < area.left - 4 || x > area.right + 4) return;
      x = Math.min(Math.max(x, area.left + 26), area.right - 26);
      ctx.fillStyle = m.colour;
      ctx.fillText(m.text, x, m.y);
    });
    ctx.restore();
  }
};

function shortCrash(period){
  if(/GFC|Financial/i.test(period)) return "GFC '07";
  if(/EU|Debt/i.test(period))       return "EU '11";
  if(/COVID/i.test(period))         return 'COVID';
  if(/Rate|Hike|Bear/i.test(period))return 'Hikes';
  return period;
}

function externalTooltip(context){
  var tip = document.getElementById('tooltip');
  if(!tip) return;
  var model = context.tooltip;
  if(model.opacity === 0){ tip.style.opacity = 0; return; }

  var strat = null, spyV = null, label = null, seriesName = 'Strategy';
  model.dataPoints.forEach(function(dp){
    label = dp.raw.x;
    if(dp.dataset.label === 'SPY Benchmark') spyV = dp.raw.y;
    else if(strat === null){ strat = dp.raw.y; seriesName = dp.dataset.label; }
  });
  if(label === null){ tip.style.opacity = 0; return; }

  var html = '<div class="tt-date">' + prettyDate(String(label)) + '</div>';
  if(strat != null){
    html += '<div class="tt-row"><span>Strategy</span><span style="color:var(--chart-strategy);font-weight:600">' +
      money(strat, 0) + '</span></div>';
  }
  if(spyV != null){
    html += '<div class="tt-row"><span>SPY</span><span style="color:var(--text-muted);font-weight:600">' +
      money(spyV, 0) + '</span></div>';
  }
  if(strat != null && spyV != null){
    var diff = (strat / 10000 - 1) - (spyV / 10000 - 1);
    var col = diff >= 0 ? 'var(--positive)' : 'var(--negative)';
    html += '<div class="tt-row" style="margin-top:4px"><span>vs SPY</span><span style="color:' + col +
      ';font-weight:600">' + (diff >= 0 ? '+' : MINUS) + Math.abs(diff * 100).toFixed(1) + 'pp</span></div>';
  }
  tip.innerHTML = html;

  var box = context.chart.canvas.parentNode.getBoundingClientRect();
  var x = model.caretX, w = tip.offsetWidth || 180;
  if(x + w + 16 > box.width) x = x - w - 16; else x = x + 16;
  tip.style.opacity = 1;
  tip.style.left = Math.max(0, x) + 'px';
  tip.style.top = Math.max(0, model.caretY - 40) + 'px';
}

/* ---------- crash table ---------- */
function crashHTML(){
  // Both bars scale against the deeper of the two, so a period where the strategy fell
  // further renders as a visibly longer bar instead of being clamped to look equal.
  var rows = DATA.crash_table.map(function(r){
    var worst = Math.max(Math.abs(r.strategy), Math.abs(r.spy));
    var sW = Math.abs(r.strategy) / worst * 100;
    var pW = Math.abs(r.spy) / worst * 100;
    var win = r.edge_pp > 0;
    var html =
      '<tr class="data-row">' +
        '<td class="period">' + r.period + '<div style="font-size:.7rem;color:var(--text-muted);font-weight:400">' +
          prettyDate(r.start) + ' – ' + prettyDate(r.end) + '</div></td>' +
        '<td><span class="pill neg">' + pctPlain(r.strategy, 1) + '</span></td>' +
        '<td><span class="pill spy">' + pctPlain(r.spy, 1) + '</span></td>' +
        '<td><span class="pill ' + (win ? 'win' : 'lose') + '">' +
          (win ? '✅ +' : '⚠ ' + MINUS) + Math.abs(r.edge_pp).toFixed(1) + 'pp</span></td>' +
        '<td class="bars">' +
          '<div class="bar bar-strategy" style="width:' + sW.toFixed(1) + '%"></div>' +

      '<tbody>' + rows + '</tbody>' +
    '</table></div>' +

  var labels = sh.months.slice();

/* ---------- heatmap ---------- */
function heatColour(r){
  var v = r * 100;
  if(v > 0){
    if(v >= 8) return 'var(--heatmap-pos5)';
    if(v >= 6) return 'var(--heatmap-pos4)';
    if(v >= 4) return 'var(--heatmap-pos3)';
    if(v >= 2) return 'var(--heatmap-pos2)';
    return 'var(--heatmap-pos1)';
  }
  if(v < 0){
    if(v <= -8) return 'var(--heatmap-neg5)';
    if(v <= -6) return 'var(--heatmap-neg4)';
    if(v <= -4) return 'var(--heatmap-neg3)';
    if(v <= -2) return 'var(--heatmap-neg2)';
    return 'var(--heatmap-neg1)';
  }
  return 'var(--bg-secondary)';
}

function heatmapHTML(){
  var mr = DATA.monthly_returns;
  var byMonth = {};
  mr.forEach(function(r){ byMonth[r.month] = r; });
  var years = mr.map(function(r){ return parseInt(r.month.slice(0, 4), 10); });
  var y0 = Math.min.apply(null, years), y1 = Math.max.apply(null, years);

  var cells = '<div class="hm" style="grid-template-columns:44px repeat(12,1fr) 68px">';
  cells += '<div></div>';
  MONTHS.forEach(function(m){ cells += '<div class="hm-h">' + m + '</div>'; });
  cells += '<div class="hm-h">Year</div>';

  for(var y = y0; y <= y1; y++){
    cells += '<div class="hm-y">' + y + '</div>';
    var compound = 1, seen = 0;
    for(var m = 1; m <= 12; m++){
      var key = y + '-' + (m < 10 ? '0' + m : m);
      var row = byMonth[key];
      if(!row){ cells += '<div class="hm-empty"></div>'; continue; }
      compound *= (1 + row.strategy); seen++;
      var title = MONTHS[m - 1] + ' ' + y +
        ' — Strategy: ' + pct(row.strategy, 1) + ' | SPY: ' + pct(row.spy, 1);
      cells += '<div class="hm-cell" title="' + title + '">' +
        '<i style="background:' + heatColour(row.strategy) + '"></i>' +
        '<i style="background:' + heatColour(row.spy) + '"></i>' +
      '</div>';
    }
    if(seen){
      var annual = compound - 1;
      var cls = annual >= 0 ? 'win' : 'neg';
      var style = annual >= 0
        ? 'background:var(--positive-soft);color:var(--positive)'
        : 'background:var(--negative-soft);color:var(--negative)';
      cells += '<div class="hm-pill" style="' + style + '" title="' + y +
        (seen < 12 ? ' (partial year, ' + seen + ' months)' : '') + '">' + pct(annual, 1) + '</div>';
    } else {
      cells += '<div></div>';
    }
  }
  cells += '</div>';

  return '<div class="card">' +
    '<div class="title-row"><div>' +
      '<div class="card-title">Monthly Performance — Portfolio vs S&amp;P 500</div>' +
      '<div class="card-sub">Upper bar = strategy, lower bar = SPY · hover any cell for exact figures</div>' +
    '</div></div>' +
    '<div class="scroll-x">' + cells + '</div>' +
    '<div class="hm-legend">' +
      '<span style="display:flex;align-items:center;gap:8px">' + MINUS + '10%+' +
        '<span class="grad" id="hmGrad"></span>+10%+</span>' +
      '<span style="display:flex;align-items:center;gap:8px">' +
        '<span style="display:inline-flex;flex-direction:column;gap:1px;width:22px">' +
          '<i style="display:block;height:8px;border-radius:2px;background:var(--heatmap-pos4)"></i>' +
          '<i style="display:block;height:8px;border-radius:2px;background:var(--heatmap-pos1)"></i>' +
        '</span>each cell stacks strategy over SPY</span>' +
      '<span>Year column compounds the strategy’s months in that calendar year.</span>' +
    '</div>' +
  '</div>';
}

function paintHeatmap(){
  var mr = DATA.monthly_returns;
  var byMonth = {};
  mr.forEach(function(r){ byMonth[r.month] = r; });
  // Re-resolve var() colours after a theme flip (inline vars follow automatically,
  // but the gradient bar is painted from computed values).
  var g = document.getElementById('hmGrad');
  if(g){
    g.style.background = 'linear-gradient(90deg,' + cssVar('--heatmap-neg5') + ',' +
      cssVar('--heatmap-neg2') + ',' + cssVar('--bg-secondary') + ',' +
      cssVar('--heatmap-pos2') + ',' + cssVar('--heatmap-pos5') + ')';
  }
}

/* ---------- about ---------- */
function aboutHTML(){
  var n = DATA.notes || {};
  return '<div class="card">' +
    '<button class="acc-btn" id="aboutBtn" aria-expanded="false">' +
      '<span>About This Strategy</span>' +
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" ' +
        'stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>' +
    '</button>' +
    '<div class="acc-body" id="aboutBody">' +
      '<h4>Method</h4><p>' + (n.strategy || '') + '</p>' +
      '<h4>Benchmark</h4><p>' + (n.benchmark || '') + '</p>' +
      '<h4>Drawdown</h4><p>' + (n.drawdown || '') + '</p>' +
      '<h4>Sector history</h4><p>' + (n.sector_history || '') + '</p>' +
      '<h4>Live account</h4><p>' + (n.live || '') + '</p>' +
      '<h4>Reading the chart</h4>' +
      '<ul>' +
        '<li><b>Backtest</b> — certified walk-forward research window, drawn dashed.</li>' +
        '<li><b>Simulation</b> — the ' + DATA.headline.window_end.slice(0, 4) +
          ' out-of-sample continuation, drawn amber.</li>' +
        '<li><b>Live paper trading</b> — the funded account, rebased onto the simulated ' +
          'curve so both fit one axis. True dollar NAV is reported in the header and hero card.</li>' +
      '</ul>' +
      '<h4>Data as of</h4><p>Snapshot generated ' + (DATA.generated_at || DATA.as_of) + '.</p>' +
    '</div>' +
  '</div>';
}

function wireAccordion(){
  var btn = document.getElementById('aboutBtn');
  var body = document.getElementById('aboutBody');
  if(!btn) return;
  btn.addEventListener('click', function(){
    var open = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', String(!open));
    body.classList.toggle('open', !open);
  });
  paintHeatmap();
}
</script>
</body>
</html>
