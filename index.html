<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Systematic Equity — Quant Portfolio Dashboard</title>
<meta name="description" content="Walk-forward out-of-sample results for a long-only multi-factor systematic equity strategy, net of costs, benchmarked against SPY.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<style>
:root{
  --bg:#fafaf8; --bg-2:#f1f5f9; --surface:#ffffff; --surface-2:#f8fafc;
  --border:#e2e8f0;
  --shadow:0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
  --shadow-lg:0 8px 32px rgba(0,0,0,.10);
  --text-1:#0f172a; --text-2:#475569; --text-3:#94a3b8;
  --blue:#1d4ed8; --blue-soft:rgba(29,78,216,.08);
  --purple:#6d28d9; --purple-soft:rgba(109,40,217,.08);
  --green:#059669; --green-soft:rgba(5,150,105,.08);
  --red:#dc2626; --red-soft:rgba(220,38,38,.06);
  --amber:#b45309; --amber-soft:rgba(180,83,9,.08);
  --grey-soft:rgba(148,163,184,.10);
  --chart-1:#1d4ed8; --chart-backtest:#94a3b8; --chart-sim:#f59e0b;
  --chart-spy:rgba(148,163,184,.35); --chart-spy-bg:rgba(148,163,184,.07);
  --crash-bg:rgba(220,38,38,.04);
  --hm-5p:#14532d; --hm-4p:#15803d; --hm-3p:#16a34a; --hm-2p:#4ade80; --hm-1p:#bbf7d0;
  --hm-1n:#fee2e2; --hm-2n:#fca5a5; --hm-3n:#ef4444; --hm-4n:#dc2626; --hm-5n:#7f1d1d;
  --sec-1:#1d4ed8; --sec-2:#6d28d9; --sec-3:#059669; --sec-4:#b45309;
  --sec-5:#dc2626; --sec-6:#0891b2; --sec-7:#65a30d; --sec-8:#475569;
  --sec-cash:rgba(148,163,184,.22);
}
html[data-theme="dark"]{
  --bg:#111111; --bg-2:#161616; --surface:#1c1c1c; --surface-2:#181818;
  --border:#333333;
  --shadow:0 1px 3px rgba(0,0,0,.5), 0 4px 16px rgba(0,0,0,.4);
  --shadow-lg:0 12px 30px rgba(0,212,255,.25);
  --text-1:#f4f4f5; --text-2:#a1a1aa; --text-3:#52525b;
  --blue:#00d4ff; --blue-soft:rgba(0,212,255,.08);
  --purple:#bf7fff; --purple-soft:rgba(191,127,255,.10);
  --green:#84cc16; --green-soft:rgba(132,204,22,.08);
  --red:#f87171; --red-soft:rgba(248,113,113,.08);
  --amber:#f59e0b; --amber-soft:rgba(245,158,11,.10);
  --grey-soft:rgba(161,161,170,.10);
  --chart-1:#00d4ff; --chart-backtest:#8a8a93; --chart-sim:#f59e0b;
  --chart-spy:rgba(161,161,170,.25); --chart-spy-bg:rgba(161,161,170,.05);
  --crash-bg:rgba(248,113,113,.06);
  --hm-5p:#065f46; --hm-4p:#059669; --hm-3p:#34d399; --hm-2p:#6ee7b7; --hm-1p:#d1fae5;
  --hm-1n:#fef2f2; --hm-2n:#fca5a5; --hm-3n:#f87171; --hm-4n:#ef4444; --hm-5n:#991b1b;
  --sec-1:#00d4ff; --sec-2:#bf7fff; --sec-3:#34d399; --sec-4:#f59e0b;
  --sec-5:#f87171; --sec-6:#22d3ee; --sec-7:#a3e635; --sec-8:#71717a;
  --sec-cash:rgba(161,161,170,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--text-1); line-height:1.5;
  -webkit-font-smoothing:antialiased;
  transition:background .3s, color .2s;
}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px 80px}

/* ---------------- header ---------------- */
.hdr{
  position:sticky; top:0; z-index:100;
  background:var(--surface); border-bottom:1px solid var(--border);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  transition:background .3s, border-color .3s;
}
.hdr-inner{
  max-width:1240px; margin:0 auto; padding:0 28px; min-height:60px;
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;flex-wrap:wrap}
.brand-name{
  font-weight:700; font-size:1.15rem; letter-spacing:-.02em; color:var(--text-1);
}
.brand-tag{font-size:.75rem;color:var(--text-3);margin-left:10px}
.nav-right{display:flex;align-items:center;gap:12px}
.search-bar{display:flex;align-items:center;gap:8px;background:var(--bg-2);
  border:1px solid var(--border);border-radius:6px;padding:6px 12px;
  font-size:.8rem;color:var(--text-3);white-space:nowrap;
  transition:background .3s, border-color .3s}
.user-avatar{width:36px;height:36px;border-radius:50%;flex:none;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  border:2px solid var(--surface)}
.nav-pill{
  display:inline-flex; align-items:center; gap:8px;
  background:var(--blue-soft); border:1px solid var(--blue); border-radius:999px;
  padding:6px 14px; font-size:.82rem; font-weight:500; color:var(--text-1);
  white-space:nowrap; font-variant-numeric:tabular-nums;
}
.pulse-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;
  background:var(--green);animation:pulse 2s ease-in-out infinite}
.pulse-dot.neg{background:var(--red)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.7}}
.theme-btn{
  width:64px;height:30px;border-radius:15px;border:1px solid var(--border);
  background:var(--surface-2);cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:space-between;padding:0 4px;
  transition:background .3s, border-color .3s;
  position:relative;
}
/* Both icons stay put; the thumb slides over whichever one is not the active mode.
   pointer-events:none so a click on an emoji still lands on the button. */
.tb-icon{font-size:12px;line-height:1;pointer-events:none;user-select:none}
.theme-btn-thumb{
  width:22px;height:22px;border-radius:50%;
  background:var(--text-2);
  transition:transform .3s cubic-bezier(.4,0,.2,1), background .3s;
  position:absolute;left:4px;
}
html[data-theme="dark"] .theme-btn-thumb{
  transform:translateX(32px); background:var(--blue);
}
.theme-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------------- page title ---------------- */
.page-title-row{display:flex;justify-content:space-between;align-items:center;
  gap:16px;flex-wrap:wrap;margin-top:28px}
.page-title-row h1{font-size:1.8rem;font-weight:700;letter-spacing:-.03em}
.opt-btn{background:var(--blue);color:#fff;border:none;border-radius:6px;
  padding:8px 16px;font-size:.85rem;font-weight:600;cursor:pointer;
  font-family:inherit;display:flex;align-items:center;gap:6px;
  transition:filter .2s}
.opt-btn:hover{filter:brightness(1.1)}
html[data-theme="dark"] .opt-btn{color:#06131a}

/* ---------------- hero stats ---------------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px}
.stat{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:22px 24px; box-shadow:var(--shadow); border-left:3px solid transparent;
  transition:transform .2s, box-shadow .2s, background .3s, border-color .3s;
}
.stat:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.stat.blue{border-left-color:var(--blue)}
.stat.purple{border-left-color:var(--purple)}
.stat.amber{border-left-color:var(--amber)}
.stat.green{border-left-color:var(--green)}
.stat.red-left{border-left-color:var(--red)}
.stat-lbl{font-size:.65rem;font-weight:500;text-transform:uppercase;
  letter-spacing:.12em;color:var(--text-3)}
.stat-num{font-size:2.5rem;font-weight:900;letter-spacing:-.025em;line-height:1.1;
  margin:7px 0 3px;font-variant-numeric:tabular-nums}
.stat-sub{font-size:.78rem;color:var(--text-2)}

/* ---------------- cards ---------------- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:26px; box-shadow:var(--shadow); margin-top:20px;
  transition:background .3s, border-color .3s;
}
.card-hdr{display:flex;align-items:flex-end;justify-content:space-between;
  margin-bottom:20px;gap:12px;flex-wrap:wrap}
.card-title{font-size:1rem;font-weight:600;color:var(--text-1)}
.card-sub{font-size:.78rem;color:var(--text-2);margin-top:2px}
.card-stat{font-size:.8rem;color:var(--text-2);text-align:right}
.card-stat b{color:var(--text-1);font-weight:600}

/* ---------------- 2-column app grid ---------------- */
.main-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;
  align-items:start}
.col-left,.col-right{display:flex;flex-direction:column;gap:20px;min-width:0}
/* The grid gap owns the spacing here, so the stacked-card margin is dropped. */
.main-grid .card{margin-top:0}
/* At half width the holdings pairs would be ~270px each and the company names would
   all ellipsis away, so the inner grid collapses to a single column. */
.main-grid .holdings-grid{grid-template-columns:1fr}

/* The heatmap and the crash table both carry a min-width tuned for a full-bleed card.
   Left alone in a ~580px column they overflow their scroller and silently hide the
   right-hand edge — Oct/Nov/Dec and the YTD pill in the heatmap's case. Both are
   retuned to fit the column instead, so nothing is hidden behind a sideways scroll. */
.main-grid .hm{min-width:0;grid-template-columns:28px repeat(12,1fr) 50px}
.main-grid .hm-h{font-size:.56rem;letter-spacing:.01em}
.main-grid .hm-yr{font-size:.62rem;padding-right:4px}
.main-grid .hm-p{font-size:.6rem;padding:2px 3px;margin-left:4px}
.main-grid .hm-c i{height:11px}
.main-grid .hm-x{height:23px}
.main-grid .hm-lg{gap:14px;font-size:.68rem}
.main-grid .grad{width:110px}

.main-grid table{min-width:0}
.main-grid thead th,.main-grid tbody td{padding-right:8px}
.main-grid .per small{font-size:.64rem}
.main-grid .bars{min-width:78px}
.main-grid .bar-cap{display:none}

/* ---------------- charts ---------------- */
.chart-box{position:relative;height:420px}
.chart-box.short{height:300px}
.chart-hint{text-align:center;font-size:.74rem;color:var(--text-3);margin-top:14px}
#tt{
  position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:14px;min-width:180px;box-shadow:var(--shadow-lg);font-size:.8rem;z-index:20;
}
#tt .tt-d{font-weight:600;margin-bottom:7px;color:var(--text-1)}
#tt .tt-r{display:flex;justify-content:space-between;gap:18px;
  font-variant-numeric:tabular-nums;line-height:1.7}
#tt .tt-r span:first-child{color:var(--text-2)}

/* ---------------- crash table ---------------- */
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:640px}
thead th{text-align:left;font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;
  color:var(--text-3);font-weight:500;padding:0 14px 11px 0;border-bottom:1px solid var(--border)}
tbody td{padding:13px 14px 13px 0;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr.r:hover{background:var(--surface-2)}
tbody tr.r{transition:background .15s}
.per{font-weight:600;color:var(--text-1)}
.per small{display:block;font-size:.7rem;color:var(--text-3);font-weight:400}
.pill{display:inline-block;border-radius:7px;padding:3px 10px;font-weight:600;
  font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.grey{background:var(--grey-soft);color:var(--text-2)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.bars{min-width:190px}
.bar{height:5px;border-radius:3px}
.bar.s{background:var(--red);margin-bottom:3px}
.bar.b{background:var(--border)}
.bar-cap{font-size:.65rem;color:var(--text-3);margin-top:5px}
.note td{padding:0 0 13px;border-bottom:1px solid var(--border);
  color:var(--amber);font-size:.75rem;font-style:italic}

/* ---------------- holdings ---------------- */
.holdings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.hold{
  background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
  padding:16px 18px; border-left:3px solid var(--text-3);
  opacity:0; animation:fadeUp .4s ease forwards;
  transition:background .3s, border-color .3s, transform .2s, box-shadow .2s;
}
.hold:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.h-r1{display:flex;align-items:baseline;gap:9px;margin-bottom:6px}
.h-tkr{font-weight:700;font-size:.95rem;color:var(--text-1)}
.h-co{font-size:.82rem;color:var(--text-2);flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.68rem;
  font-weight:500;text-transform:uppercase;letter-spacing:.06em;flex:none}
.h-r2{font-size:.82rem;color:var(--text-2);font-variant-numeric:tabular-nums}
.wbar{height:4px;margin-top:10px;background:var(--border);border-radius:2px;overflow:hidden}
.wbar>i{display:block;height:4px;border-radius:2px;background:var(--blue);
  transition:width .8s ease}
.wlbl{font-size:.7rem;color:var(--text-3);text-align:right;margin-top:3px;
  font-variant-numeric:tabular-nums}
.h-total{text-align:right;font-size:.8rem;color:var(--text-2);margin-top:16px;
  font-variant-numeric:tabular-nums}
.h-note{font-size:.74rem;color:var(--text-3);font-style:italic;margin-top:7px}

/* ---------------- heatmap ---------------- */
.hm{display:grid;grid-template-columns:38px repeat(12,1fr) 60px;gap:2px;min-width:780px}
.hm-h{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-3);text-align:center;padding-bottom:3px}
.hm-yr{text-align:right;padding-right:6px;font-size:.7rem;color:var(--text-3);
  display:flex;align-items:center;justify-content:flex-end}
.hm-c{display:flex;flex-direction:column;gap:1px}
.hm-c i{display:block;height:13px;border-radius:2px}
.hm-x{height:27px;background:var(--bg-2);border-radius:2px}
.hm-p{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;margin-left:6px;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.hm-lg{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:18px;
  font-size:.72rem;color:var(--text-3)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;
  vertical-align:-1px}
.grad{width:170px;height:9px;border-radius:5px}

/* ---------------- about ---------------- */
.acc-btn{width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:18px 0;border:none;background:none;cursor:pointer;font-weight:600;
  color:var(--text-1);font-family:inherit;font-size:1rem;
  border-top:1px solid var(--border);text-align:left}
.acc-btn svg{transition:transform .3s;flex:none;stroke:var(--text-3)}
.acc-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.acc-c{max-height:0;overflow:hidden;transition:max-height .35s ease}
.acc-in{padding-bottom:20px;font-size:.86rem;color:var(--text-2)}
.acc-in h4{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;
  color:var(--text-3);margin:16px 0 6px;font-weight:600}
.acc-in p{margin-bottom:8px}
.acc-in ul{margin:0 0 8px 18px}

/* ---------------- footer ---------------- */
footer{max-width:1240px;margin:40px auto 0;padding:40px 28px 20px;
  border-top:1px solid var(--border);
  display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;
  font-size:.78rem;color:var(--text-3)}
footer a{color:var(--text-2);text-decoration:none;transition:color .2s}
footer a:hover{color:var(--blue)}
.f-mid{text-align:center}
.f-end{display:flex;gap:16px;justify-content:flex-end;align-items:center}
.f-end svg{fill:var(--text-3);transition:fill .2s}
.f-end a:hover svg{fill:var(--blue)}
.loading{text-align:center;padding:70px 0;color:var(--text-3)}

@media (max-width:768px){
  .wrap{padding:0 16px 56px}
  .hdr-inner{padding:0 16px}
  .brand{width:100%}
  .nav-right{width:100%;flex-wrap:wrap;padding-bottom:8px}
  .main-grid{grid-template-columns:1fr}
  .search-bar,.user-avatar{display:none}
  .page-title-row h1{font-size:1.4rem}
  .stats{grid-template-columns:repeat(2,1fr);gap:12px}
  .stat{padding:16px 18px}
  .stat-num{font-size:1.9rem}
  .holdings-grid{grid-template-columns:1fr}
  .card{padding:18px}
  .chart-box,.chart-box.short{height:280px}
  footer{grid-template-columns:1fr;text-align:center;padding:32px 16px 20px}
  .f-end{justify-content:center}
}
</style>
</head>

      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05a3.74 3.74 0 0 1 3.37-1.85c3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0 4.13ZM7.12 20.45H3.55V9h3.57v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0Z"/></svg>
    </a>
  </div>
</footer>

<script>
/* ===================== theme ===================== */
const root = document.documentElement;
const btn  = document.getElementById('theme-btn');
(function bootTheme(){
  let stored = null;
  try { stored = localStorage.getItem('theme'); } catch(e){}
  const sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  root.setAttribute('data-theme', stored || sys);
})();
function updateBtn(){
  // The pill carries no text, so the thumb position is the only visual state. Mirror it
  // into aria-pressed, otherwise the control is unreadable to assistive tech.
  btn.setAttribute('aria-pressed', String(root.getAttribute('data-theme') === 'dark'));
}
function isDark(){ return root.getAttribute('data-theme') === 'dark'; }
function cv(name){ return getComputedStyle(root).getPropertyValue(name).trim(); }

btn.addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e){}
  updateBtn();
  rebuildCharts();
});

/* ===================== helpers ===================== */
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const LONG = ['January','February','March','April','May','June','July','August',
              'September','October','November','December'];
const MINUS = '−';

const pct  = (x,d=2) => (x>=0?'+':MINUS) + Math.abs(x*100).toFixed(d) + '%';
const pctP = (x,d=1) => (x>=0?'':MINUS) + Math.abs(x*100).toFixed(d) + '%';
const pctBig = x => (x>=0?'+':MINUS) + Math.round(Math.abs(x*100)).toLocaleString('en-US') + '%';
const usd  = (x,d=0) => '$' + Number(x).toLocaleString('en-US',
                        {minimumFractionDigits:d, maximumFractionDigits:d});
const ymLong = ym => { const p = ym.split('-'); return LONG[+p[1]-1] + ' ' + p[0]; };
const dLong  = iso => { const p = iso.split('-'); return MON[+p[1]-1]+' '+(+p[2])+', '+p[0]; };

let DATA = null;
const charts = {};

/* ===================== boot ===================== */
async function init(){
  try{
    DATA = await fetch('./portfolio_snapshot.json', {cache:'no-store'}).then(r => {
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }catch(err){
    document.getElementById('app').innerHTML =
      '<div class="loading">Could not load portfolio data (' + err.message + ').</div>';
    return;
  }
  renderHeader(DATA);
  // Stats and the equity curve stay full-bleed; everything below drops into the two
  // app-shell columns. The sections are composed here rather than moved in markup
  // because each one is built as a string by its own *HTML() function.
  document.getElementById('app').innerHTML =
    statsHTML(DATA) + equityHTML(DATA) +
    '<div class="main-grid">' +
      '<div class="col-left">'  + holdingsHTML(DATA) + crashHTML(DATA)   + '</div>' +
      '<div class="col-right">' + heatmapHTML(DATA)  + sectorHTML(DATA)  + '</div>' +
    '</div>' +
    aboutHTML(DATA);
  wireAccordion();
  paintGradient();
  renderEquityCurve(DATA);
  renderSectorChart(DATA);
  updateBtn();
}
document.addEventListener('DOMContentLoaded', init);

function rebuildCharts(){
  Object.keys(charts).forEach(k => { if(charts[k]){ charts[k].destroy(); charts[k] = null; } });
  if(!DATA) return;
  renderEquityCurve(DATA);
  renderSectorChart(DATA);
  paintGradient();
}

/* ===================== header ===================== */
function renderHeader(d){
  const l = d.live || {};
  const up = !(l.since_inception_return < 0);
  document.getElementById('dot').className = 'pulse-dot' + (up ? '' : ' neg');
  document.getElementById('navtxt').textContent =
    (l.nav != null ? usd(l.nav,2) : '—') + ' · ' +
    (l.since_inception_return != null ? pct(l.since_inception_return,2) : '—');
}

/* ===================== hero stats ===================== */
function statsHTML(d){
  const h = d.headline, l = d.live || {};
  const up = !(l.since_inception_return < 0);
  const card = (cls,lbl,num,colour,sub) =>
    `<div class="stat ${cls}">
       <div class="stat-lbl">${lbl}</div>
       <div class="stat-num" style="color:var(${colour})">${num}</div>
       <div class="stat-sub">${sub}</div>
     </div>`;

  return '<div class="stats">' +
    card('blue', `Backtested CAGR · ${h.months_oos} months`, pct(h.cagr,2), '--blue',
         `vs SPY ${pct(h.benchmark_cagr,2)} · ${h.excess_vs_spy_bps>=0?'+':MINUS}${Math.abs(h.excess_vs_spy_bps)} bps/yr alpha`) +
    card('purple', 'Sharpe ratio · net of costs', h.sharpe.toFixed(3), '--purple',
         `vs SPY ${h.benchmark_sharpe.toFixed(3)} · ${Math.round((h.sharpe/h.benchmark_sharpe-1)*100)}% better risk-adjusted`) +
    card('amber', `Max drawdown · ${h.max_drawdown_basis}`, pctP(h.max_drawdown,2), '--amber',
         `vs SPY ${pctP(h.benchmark_max_drawdown,1)} · ${(h.benchmark_max_drawdown/h.max_drawdown).toFixed(1)}× less tail risk`) +
    card(up?'green':'red-left',
         `Live P&L · since ${MON[+l.inception_date.slice(5,7)-1]} ${l.inception_date.slice(0,4)}`,
         (up?'▲ ':'▼ ') + pct(l.since_inception_return,1), up?'--green':'--red',
         `NAV ${usd(l.nav,2)} · ${l.days_live} days live`) +
  '</div>';
}

/* ===================== equity curve ===================== */
function equityHTML(d){
  const h = d.headline, spy = d.equity_curve.spy;
  const spyTot = spy[spy.length-1].v / spy[0].v - 1;
  return `<div class="card">
    <div class="card-hdr">
      <div>
        <div class="card-title">Performance Since ${ymLong(h.window_start.slice(0,7))}</div>
        <div class="card-sub">Growth of ${usd(10000)}, net of costs · benchmarked against SPY</div>
      </div>
      <div class="card-stat">Total Return: <b>${pctBig(h.total_return)}</b> · vs SPY <b>${pctBig(spyTot)}</b></div>
    </div>
    <div class="chart-box"><canvas id="equity"></canvas><div id="tt"></div></div>
    <p class="chart-hint">Scroll to zoom · Drag to pan · Double-click to reset</p>
  </div>`;
}

const xy = arr => arr.map(p => ({x:p.d, y:p.v}));

/* Vertical wash under a line: the token's own colour at `alpha` fading to transparent.
   Reading the rgb out of the CSS variable means the fill re-derives per theme instead of
   hardcoding one pair of rgba() literals. */
function rgbOf(token){
  const v = cv(token);
  if(v.startsWith('#')){
    const h = v.slice(1);
    const n = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
    return [parseInt(n.slice(0,2),16), parseInt(n.slice(2,4),16), parseInt(n.slice(4,6),16)];
  }
  const m = v.match(/-?\d+(\.\d+)?/g) || [148,163,184];
  return [ +m[0], +m[1], +m[2] ];
}
function fadeDown(token, alpha){
  const [r,g,b] = rgbOf(token);
  return ctx => {
    const area = ctx.chart.chartArea;
    if(!area) return 'transparent';
    const grad = ctx.chart.ctx.createLinearGradient(0, area.top, 0, area.bottom);
    grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
    grad.addColorStop(1, 'transparent');
    return grad;
  };
}

/* Shading is driven off crash_table rather than a hardcoded date list, so the bands and
   the table below can never end up describing different windows. */
const crashShade = {
  id:'crashShade',
  beforeDatasetsDraw(chart){
    const {ctx, chartArea:a, scales} = chart;
    if(!a || !DATA?.crash_table) return;
    ctx.save();
    ctx.fillStyle = cv('--crash-bg');
    DATA.crash_table.forEach(r => {
      const x0 = scales.x.getPixelForValue(new Date(r.start).getTime());
      const x1 = scales.x.getPixelForValue(new Date(r.end).getTime());
      const s = Math.max(Math.min(x0,x1), a.left), e = Math.min(Math.max(x0,x1), a.right);
      if(e > s) ctx.fillRect(s, a.top, e - s, a.height);
    });
    ctx.restore();
  }
};

/* Dark mode gives the live line a glow, matching the mockup. Scoped to that one dataset —
   a canvas-wide CSS filter would smear the benchmark and the gridlines too. */
const liveGlow = {
  id:'liveGlow',
  beforeDatasetDraw(chart,args){
    if(!isDark() || chart.data.datasets[args.index].key !== 'live') return;
    chart.ctx.save();
    // save/restore keeps the glow on this one line. Setting shadow straight onto the
    // shared context (e.g. from an animation hook) leaks it onto the gridlines and the
    // benchmark fill drawn afterwards, and vanishes once the animation stops.
    chart.ctx.shadowColor = 'rgba(0,212,255,.6)';
    chart.ctx.shadowBlur = 12;
  },
  afterDatasetDraw(chart,args){
    if(!isDark() || chart.data.datasets[args.index].key !== 'live') return;
    chart.ctx.restore();
  }
};

function shortCrash(p){
  if(/GFC|Financial/i.test(p))  return "GFC '08";
  if(/EU|Debt/i.test(p))        return "EU '11";
  if(/COVID/i.test(p))          return "COVID '20";
  if(/Rate|Hike|Bear/i.test(p)) return "Hikes '22";
  return p;
}

const annotations = {
  id:'annotations',
  afterDatasetsDraw(chart){
    const {ctx, chartArea:a, scales} = chart;
    if(!a) return;
    // Below roughly a phone's width these collapse into an unreadable smear, so the
    // crash callouts drop out; the shaded bands and the table still name the windows.
    const roomy = (a.right - a.left) > 520;
    const marks = [];
    if(roomy && DATA.crash_table){
      DATA.crash_table.forEach(r => marks.push({
        d:r.start, t:'▼ ' + shortCrash(r.period),
        c: /Rate|Hike|Bear/i.test(r.period) ? cv('--amber') : cv('--red'),
        y: a.top + 15
      }));
    }
    if(DATA.live?.inception_date){
      marks.push({d:DATA.live.inception_date, t:'📍 Live', c:cv('--blue'), y:a.top + 15});
    }
    ctx.save();
    ctx.font = '600 11px Inter, sans-serif';
    ctx.textAlign = 'center';
    marks.forEach(m => {
      let x = scales.x.getPixelForValue(new Date(m.d).getTime());
      if(x < a.left - 4 || x > a.right + 4) return;
      x = Math.min(Math.max(x, a.left + 30), a.right - 30);
      ctx.fillStyle = m.c;
      ctx.fillText(m.t, x, m.y);
    });
    ctx.restore();
  }
};

function renderEquityCurve(d){
  const el = document.getElementById('equity');
  if(!el) return;
  const ec = d.equity_curve;
  charts.equity = new Chart(el.getContext('2d'), {
    type:'line',
    data:{datasets:[
      {key:'spy', label:'SPY Benchmark', data:xy(ec.spy), borderColor:cv('--chart-spy'),
       backgroundColor:cv('--chart-spy-bg'), borderWidth:1, pointRadius:0,
       pointHitRadius:8, fill:'origin', tension:0, order:4},
      {key:'backtest', label:'Backtest', data:xy(ec.backtest),
       borderColor:cv('--chart-backtest'), borderDash:[5,5], borderWidth:1.5,
       pointRadius:0, pointHitRadius:8, tension:0, order:3,
       fill:'origin', backgroundColor:fadeDown('--chart-backtest', .10)},
      {key:'sim', label:'Simulation', data:xy(ec.simulation), borderColor:cv('--chart-sim'),
       borderWidth:2, pointRadius:0, pointHitRadius:8, fill:false, tension:0, order:2},
      {key:'live', label:'Live Paper Trading', data:xy(ec.live), borderColor:cv('--chart-1'),
       borderWidth:3, pointRadius:0, pointHitRadius:8, tension:0, order:1,
       fill:'origin', backgroundColor:fadeDown('--chart-1', isDark() ? .20 : .15)}
    ]},
    options:{
      responsive:true, maintainAspectRatio:false, normalized:true, animation:false,
      interaction:{mode:'index', intersect:false, axis:'x'},
      plugins:{
        legend:{position:'bottom',
          labels:{color:cv('--text-2'), boxWidth:14, boxHeight:2, padding:16, font:{size:11}}},
        tooltip:{enabled:false, external:extTooltip},
        crashShade:{}, liveGlow:{}, annotations:{},
        zoom:{zoom:{wheel:{enabled:true}, pinch:{enabled:true}, mode:'x'},
              pan:{enabled:true, mode:'x'}}
      },
      scales:{
        x:{type:'time', time:{unit:'year'}, bounds:'data',
           grid:{color:cv('--border')}, border:{color:cv('--border')},
           ticks:{color:cv('--text-3'), maxRotation:0, autoSkip:true, font:{size:11}}},
        y:{grid:{color:cv('--border')}, border:{color:cv('--border')},
           ticks:{color:cv('--text-3'), font:{size:11},
                  callback:v => '$' + (v/1000).toFixed(0) + 'k'}}
      }
    },
    plugins:[crashShade, liveGlow, annotations]
  });
  el.ondblclick = () => charts.equity && charts.equity.resetZoom();
}

function extTooltip(ctx){
  const tt = document.getElementById('tt');
  if(!tt) return;
  const m = ctx.tooltip;
  if(m.opacity === 0){ tt.style.opacity = 0; return; }
  let strat = null, spy = null, label = null;
  m.dataPoints.forEach(p => {
    label = p.raw.x;
    if(p.dataset.key === 'spy') spy = p.raw.y;
    else if(strat === null) strat = p.raw.y;
  });
  if(label === null){ tt.style.opacity = 0; return; }
  let html = `<div class="tt-d">${dLong(String(label))}</div>`;
  if(strat != null) html += `<div class="tt-r"><span>Strategy</span><span style="color:var(--chart-1);font-weight:600">${usd(strat)}</span></div>`;
  if(spy   != null) html += `<div class="tt-r"><span>SPY</span><span style="color:var(--text-3);font-weight:600">${usd(spy)}</span></div>`;
  if(strat != null && spy != null){
    const diff = (strat/10000-1) - (spy/10000-1);
    html += `<div class="tt-r"><span>vs SPY</span><span style="color:var(${diff>=0?'--green':'--red'});font-weight:600">${diff>=0?'+':MINUS}${Math.abs(diff*100).toFixed(1)}pp</span></div>`;
  }
  tt.innerHTML = html;
  const box = ctx.chart.canvas.parentNode.getBoundingClientRect();
  const w = tt.offsetWidth || 180;
  let x = m.caretX;
  x = (x + w + 18 > box.width) ? x - w - 18 : x + 18;
  tt.style.opacity = 1;
  tt.style.left = Math.max(0, x) + 'px';
  tt.style.top  = Math.max(0, m.caretY - 45) + 'px';
}

/* ===================== crash table ===================== */
function crashHTML(d){
  // Both bars scale against the deeper of the two, so a window where the strategy fell
  // further reads as a visibly longer bar rather than being clamped to look equal.
  const rows = d.crash_table.map(r => {
    const worst = Math.max(Math.abs(r.strategy), Math.abs(r.spy));
    const sw = Math.abs(r.strategy)/worst*100, bw = Math.abs(r.spy)/worst*100;
    const win = r.edge_pp > 0;
    let html = `<tr class="r">
      <td class="per">${r.period}<small>${dLong(r.start)} – ${dLong(r.end)}</small></td>
      <td><span class="pill red">${pctP(r.strategy,1)}</span></td>
      <td><span class="pill grey">${pctP(r.spy,1)}</span></td>
      <td><span class="pill ${win?'green':'amber'}">${win?'✅ +':'⚠ '+MINUS}${Math.abs(r.edge_pp).toFixed(1)}pp</span></td>
      <td class="bars">
        <div class="bar s" style="width:${sw.toFixed(1)}%"></div>
        <div class="bar b" style="width:${bw.toFixed(1)}%"></div>
        <div class="bar-cap">strategy vs SPY drawdown · shorter is better</div>
      </td></tr>`;
    // Driven by the sign of edge_pp, not pinned to a year, so it stays true if data moves.
    if(!win){
      html += `<tr class="note"><td colspan="5">⚠ Published for transparency — strategy lagged in this window</td></tr>`;
    }
    return html;
  }).join('');

  return `<div class="card">
    <div class="card-hdr"><div>
      <div class="card-title">Capital Preservation During Market Crises</div>
      <div class="card-sub">Peak-to-trough drawdown inside each window · all periods shown, wins and losses · bars scaled to the deeper drawdown, shorter is better</div>
    </div></div>
    <div class="scroll-x"><table>
      <thead><tr><th>Period</th><th>Strategy</th><th>SPY</th><th>Edge</th><th>Relative depth</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

/* ===================== holdings ===================== */
const CHIP = {
  'Finance':          'background:var(--blue-soft);color:var(--blue)',
  'Manufacturing':    'background:var(--purple-soft);color:var(--purple)',
  'Healthcare':       'background:var(--green-soft);color:var(--green)',
  'Consumer Durables':'background:var(--amber-soft);color:var(--amber)',
  'Other':            'background:var(--grey-soft);color:var(--text-2)'
};
const EDGE = {
  'Finance':'var(--blue)', 'Manufacturing':'var(--purple)', 'Healthcare':'var(--green)',
  'Consumer Durables':'var(--amber)', 'Other':'var(--text-3)'
};

function holdingsHTML(d){
  const h = d.holdings || {}, pos = h.positions || [];
  if(!pos.length){
    return `<div class="card"><div class="card-title">Current Portfolio Holdings</div>
      <div class="card-sub" style="margin-top:8px">Positions are not currently published.</div></div>`;
  }
  const total = pos.reduce((s,p) => s + p.value, 0);
  const maxW  = Math.max(...pos.map(p => p.weight));

  const cards = pos.map((p,i) => `
    <div class="hold" style="border-left-color:${EDGE[p.sector]||'var(--text-3)'};animation-delay:${i*60}ms">
      <div class="h-r1">
        <span class="h-tkr">${p.ticker}</span>
        <span class="h-co">${p.name}</span>
        <span class="chip" style="${CHIP[p.sector]||CHIP['Other']}">${p.sector}</span>
      </div>
      <div class="h-r2">${usd(p.value,2)} · ${p.shares} sh · ${usd(p.price,2)}/sh</div>
      <div class="wbar"><i style="width:${(p.weight/maxW*100).toFixed(1)}%;background:${EDGE[p.sector]||'var(--blue)'}"></i></div>
      <div class="wlbl">${(p.weight*100).toFixed(1)}%</div>
    </div>`).join('');

  return `<div class="card">
    <div class="card-hdr"><div>
      <div class="card-title">Current Portfolio Holdings</div>
      <div class="card-sub">Small Account · ${pos.length} positions · valued ${dLong(h.as_of)}${h.last_rebalance ? ' · from the '+dLong(h.last_rebalance)+' rebalance' : ''}</div>
    </div></div>
    <div class="holdings-grid">${cards}</div>
    <div class="h-total">Total deployed: ${usd(total,2)} · ${pos.length} positions</div>
    <div class="h-note">Live small-account book marked at ${dLong(h.as_of)} closing prices. Bars are scaled to the largest position.</div>
  </div>`;
}

/* ===================== sector rotation ===================== */
/* Named slots first so Finance/Healthcare/etc. keep their specified hues; anything the
   dataset carries beyond that list falls through to the next unused slot. */
const SECTOR_SLOT = {
  'Finance':1, 'Manufacturing':2, 'Healthcare':3, 'Services':4,
  'Energy':5, 'Retail':6, 'Utilities':7, 'Other':8
};
function sectorColours(names){
  const used = new Set(), out = {};
  names.forEach(n => { if(SECTOR_SLOT[n]){ out[n] = SECTOR_SLOT[n]; used.add(SECTOR_SLOT[n]); } });
  let next = 1;
  names.forEach(n => {
    if(out[n]) return;
    while(used.has(next) && next <= 8) next++;
    out[n] = next <= 8 ? next : ((Object.keys(out).length % 8) + 1);
    used.add(out[n]);
  });
  return out;
}

function sectorHTML(d){
  const folded = (d.sector_history.folded_into_other || []).join(', ');
  return `<div class="card">
    <div class="card-hdr"><div>
      <div class="card-title">20-Year Sector Composition</div>
      <div class="card-sub">How the strategy adapts across market regimes · the shaded cash band is exposure the risk layer pulled out of the market${folded ? ' · smallest sleeves folded into “Other”: '+folded : ''}</div>
    </div></div>
    <div class="chart-box short"><canvas id="sector"></canvas></div>
  </div>`;
}

function renderSectorChart(d){
  const el = document.getElementById('sector');
  if(!el) return;
  const sh = d.sector_history;
  const labels = sh.months.slice();
  const slot = sectorColours(sh.sectors);
  // In the half-width app-shell column all 21 Januaries collide into one smear, so the
  // year ruler thins out as the column narrows.
  const w = el.clientWidth || 900;
  const yrStep = w < 620 ? 3 : (w < 900 ? 2 : 1);

  const datasets = sh.sectors.map(name => ({
    label:name,
    data:sh.weights[name].map(w => w*100),
    backgroundColor:cv('--sec-' + slot[name]),
    borderWidth:0, categoryPercentage:1, barPercentage:1
  }));

  // Whatever the sleeves don't account for is cash. Plotted explicitly because the book
  // drops to 11% invested in Apr 2020 and ~14% in late 2008 — that de-risking is what
  // produces the shallow drawdown quoted above, and as blank space it just looked
  // like a hole in the data.
  datasets.push({
    label:'Cash / not invested',
    data:labels.map((_,i) => Math.max(0, (1 - sh.sectors.reduce((s,n) => s + sh.weights[n][i], 0)) * 100)),
    backgroundColor:cv('--sec-cash'), borderWidth:0, categoryPercentage:1, barPercentage:1
  });

  charts.sector = new Chart(el.getContext('2d'), {
    type:'bar',
    data:{labels, datasets},
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      interaction:{mode:'index', intersect:false},
      plugins:{
        legend:{position:'bottom',
          labels:{color:cv('--text-2'), boxWidth:10, boxHeight:10, padding:12, font:{size:11}}},
        tooltip:{
          backgroundColor:cv('--surface'), titleColor:cv('--text-1'),
          bodyColor:cv('--text-2'), borderColor:cv('--border'), borderWidth:1, padding:11,
          callbacks:{
            title:it => ymLong(String(it[0].label)),
            label:c => c.dataset.label + ': ' + c.parsed.y.toFixed(1) + '%'
          }
        }
      },
      scales:{
        // Category rather than time: on a time axis Chart.js sizes each bar from the date
        // delta, which left ragged gaps between the 248 monthly bars.
        x:{type:'category', stacked:true, grid:{display:false},
           border:{color:cv('--border')},
           ticks:{color:cv('--text-3'), maxRotation:0, autoSkip:false, font:{size:11},
                  callback:(_v,i) => {
                    const m = labels[i];
                    if(!m || m.slice(5) !== '01') return '';
                    return (+m.slice(0,4)) % yrStep === 0 ? m.slice(0,4) : '';
                  }}},
        y:{stacked:true, max:100, grid:{color:cv('--border')}, border:{color:cv('--border')},
           ticks:{color:cv('--text-3'), font:{size:11}, callback:v => v + '%'}}
      }
    }
  });
}

/* ===================== monthly heatmap ===================== */
function hmColour(v){
  if(v > 0){
    if(v >= .10) return 'var(--hm-5p)';
    if(v >= .05) return 'var(--hm-4p)';
    if(v >= .02) return 'var(--hm-3p)';
    if(v >= .005) return 'var(--hm-2p)';
    return 'var(--hm-1p)';
  }
  if(v < 0){
    if(v <= -.10) return 'var(--hm-5n)';
    if(v <= -.05) return 'var(--hm-4n)';
    if(v <= -.02) return 'var(--hm-3n)';
    if(v <= -.005) return 'var(--hm-2n)';
    return 'var(--hm-1n)';
  }
  return 'var(--bg-2)';
}

function heatmapHTML(d){
  const mr = d.monthly_returns, by = {};
  mr.forEach(r => by[r.month] = r);
  const yrs = mr.map(r => +r.month.slice(0,4));
  const y0 = Math.min(...yrs), y1 = Math.max(...yrs);

  let g = '<div class="hm"><div></div>';
  MON.forEach(m => g += `<div class="hm-h">${m}</div>`);
  g += '<div class="hm-h">YTD</div>';

  for(let y = y0; y <= y1; y++){
    g += `<div class="hm-yr">${y}</div>`;
    let comp = 1, seen = 0;
    for(let m = 1; m <= 12; m++){
      const r = by[y + '-' + String(m).padStart(2,'0')];
      if(!r){ g += '<div class="hm-x"></div>'; continue; }
      comp *= (1 + r.strategy); seen++;
      const t = `${MON[m-1]} ${y} — Strategy: ${pct(r.strategy,1)} | SPY: ${pct(r.spy,1)}`;
      g += `<div class="hm-c" title="${t}">
              <i style="background:${hmColour(r.strategy)}"></i>
              <i style="background:${hmColour(r.spy)}"></i>
            </div>`;
    }
    if(seen){
      const a = comp - 1;
      g += `<div class="hm-p" style="background:var(${a>=0?'--green-soft':'--red-soft'});color:var(${a>=0?'--green':'--red'})" title="${y}${seen<12?` (partial year, ${seen} months)`:''}">${pct(a,1)}</div>`;
    } else g += '<div></div>';
  }
  g += '</div>';

  return `<div class="card">
    <div class="card-hdr"><div>
      <div class="card-title">Monthly Performance — Portfolio vs S&amp;P 500</div>
      <div class="card-sub">Upper cell = strategy, lower cell = SPY · hover any cell for exact figures</div>
    </div></div>
    <div class="scroll-x">${g}</div>
    <div class="hm-lg">
      <span style="display:flex;align-items:center;gap:9px">${MINUS}10% <span class="grad" id="grad"></span> +10%</span>
      <span style="display:flex;align-items:center;gap:8px">
        <span style="display:inline-flex;flex-direction:column;gap:1px;width:22px">
          <i style="display:block;height:8px;border-radius:2px;background:var(--hm-4p)"></i>
          <i style="display:block;height:8px;border-radius:2px;background:var(--hm-1p)"></i>
        </span>each cell stacks strategy over SPY</span>
      <span>YTD compounds the strategy's months in that calendar year.</span>
    </div>
  </div>`;
}

function paintGradient(){
  const g = document.getElementById('grad');
  if(g) g.style.background = `linear-gradient(90deg, ${cv('--hm-5n')}, ${cv('--hm-2n')}, ${cv('--bg-2')}, ${cv('--hm-2p')}, ${cv('--hm-5p')})`;
}

/* ===================== about ===================== */
function aboutHTML(d){
  const n = d.notes || {};
  return `<div class="card">
    <button class="acc-btn" id="acc" aria-expanded="false" style="border-top:none">
      <span>About This Strategy</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="acc-c" id="accc"><div class="acc-in">
      <h4>Method</h4><p>${n.strategy||''}</p>
      <h4>Benchmark</h4><p>${n.benchmark||''}</p>
      <h4>Drawdown</h4><p>${n.drawdown||''}</p>
      <h4>Sector history</h4><p>${n.sector_history||''}</p>
      <h4>Live account</h4><p>${n.live||''}</p>
      <h4>Reading the chart</h4>
      <ul>
        <li><b>Backtest</b> — certified walk-forward research window, drawn dashed.</li>
        <li><b>Simulation</b> — the ${d.headline.window_end.slice(0,4)} out-of-sample continuation, drawn amber.</li>
        <li><b>Live</b> — the funded paper account, rebased onto the simulated curve so both fit one axis. True dollar NAV is reported in the header and the Live P&amp;L card.</li>
      </ul>
      <h4>Data as of</h4><p>Snapshot generated ${d.generated_at || d.as_of}.</p>
    </div></div>
  </div>`;
}

function wireAccordion(){
  const b = document.getElementById('acc'), c = document.getElementById('accc');
  if(!b) return;
  b.addEventListener('click', () => {
    const open = b.getAttribute('aria-expanded') === 'true';
    b.setAttribute('aria-expanded', String(!open));
    // max-height cannot transition to `auto`, so the target is measured at open time.
    c.style.maxHeight = open ? '0px' : c.scrollHeight + 'px';
  });
}
</script>
</body>
