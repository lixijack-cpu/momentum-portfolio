name: Deploy static content to Pages

# Snapshots are priced and pushed by the private daily service, so this workflow
# only gates and deploys. The schedule is a safety-net redeploy, not a refresh.
on:
  push:
    branches: ["main"]
  schedule:
    # 21:00 UTC is after the New York close in both EDT and EST.
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install snapshot validation dependencies
        run: pip install pandas yfinance
      - name: Verify snapshot before deployment
        run: python test_snapshot_gate.py && node test_holdings_ui.js
      - name: Verify dashboard copy for all books
        run: node test_dashboard_copy.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify rendered DOM for all books
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test
      # Publish only what the page loads. Scripts, tests and docs stay out of
      # the served site.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html favicon.svg og-preview.jpg preview.png \
             portfolio_snapshot.json institutional_snapshot.json shadow_snapshot.json institutional_hedged_snapshot.json \
             retail_holdings_history.json institutional_holdings_history.json hedged_holdings_history.json _site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  # A separate job, as in GitHub's Pages template: deploy-pages running ~300 ms
  # after the upload in the same job raced artifact indexing ("Found 0
  # artifact(s)"). The wait below confirms the artifact is listed before deploying.
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Job-level grant: the artifacts listing needs actions:read, which the
    # workflow-level permissions above leave unset. Job permissions replace the
    # workflow block for this job, so the Pages scopes are restated.
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Wait for github-pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 15); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length' || echo 0)
            if [ "${count:-0}" -ge 1 ]; then
              echo "github-pages artifact visible after attempt ${attempt}"
              exit 0
            fi
            sleep 2
          done
          echo "::error::github-pages artifact not visible after 30s"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
